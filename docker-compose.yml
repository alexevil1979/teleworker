services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teleagent
      POSTGRES_PASSWORD: teleagent
      POSTGRES_DB: teleagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://teleagent:teleagent@postgres:5432/teleagent?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production-32chars}
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - postgres

volumes:
  pgdata:
