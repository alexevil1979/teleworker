# Временный vhost ТОЛЬКО для первого выпуска сертификата certbot (без SSL-блока).
# После certbot замените на teleworker.fun.conf

<VirtualHost *:80>
    ServerName teleworker.fun
    ServerAlias www.teleworker.fun

    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    ErrorLog ${APACHE_LOG_DIR}/teleworker.fun-error.log
    CustomLog ${APACHE_LOG_DIR}/teleworker.fun-access.log combined
</VirtualHost>
