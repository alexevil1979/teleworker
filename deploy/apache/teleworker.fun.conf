# TeleAgent — teleworker.fun
# Установка: см. scripts/setup-apache-ssl.sh
#
# HTTP → HTTPS
<VirtualHost *:80>
    ServerName teleworker.fun
    ServerAlias www.teleworker.fun

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# HTTPS → Next.js (PM2, порт 3005)
<VirtualHost *:443>
    ServerName teleworker.fun
    ServerAlias www.teleworker.fun

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/teleworker.fun/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/teleworker.fun/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Логи (опционально)
    ErrorLog ${APACHE_LOG_DIR}/teleworker.fun-error.log
    CustomLog ${APACHE_LOG_DIR}/teleworker.fun-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # NextAuth и абсолютные URL за прокси
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass / http://127.0.0.1:3005/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3005/
</VirtualHost>
